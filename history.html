<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - 2oolTasa</title>
    <style>
        body { margin: 0; background-color: #F2EBDB; font-family: Arial, sans-serif; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        .top-bar { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
        .btn-green { background-color: #829B47; color: white; font-weight: bold; border-radius: 6px; padding: 6px 12px; border: none; cursor: pointer; }
        .btn-orange { background-color: #CC5500; color: white; font-weight: bold; border-radius: 6px; padding: 6px 12px; border: none; cursor: pointer; }
        .btn-blue { background-color: #3498db; color: white; font-weight: bold; border-radius: 6px; padding: 4px 10px; border: none; cursor: pointer; }
        .btn-red { background-color: #e74c3c; color: white; font-weight: bold; border-radius: 6px; padding: 4px 10px; border: none; cursor: pointer; }
        .header-title { font-size: 26px; font-family: serif; font-weight: bold; color: #CC5500; margin: 0; }
        .separator { border: 0; height: 1px; background-color: #dcdcdc; margin: 15px 0; }
        .filters-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .input-field, .dropdown { padding: 6px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .table-pane { flex-grow: 1; background: white; border: 1px solid #ccc; border-radius: 4px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background-color: #f7f3e8; padding: 10px; text-align: left; border-bottom: 2px solid #ccc; position: sticky; top: 0; z-index: 1; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .action-cell { display: flex; gap: 5px; justify-content: center; }
        .group-header { font-weight: bold; color: #CC5500; font-size: 13px; vertical-align: top; }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #F2EBDB; padding: 20px; border-radius: 8px; width: 600px; max-height: 90vh; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); overflow-y: auto; }
        .modal-title { font-size: 18px; font-family: serif; font-weight: bold; color: #CC5500; margin: 0; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="btn-green" onclick="window.location.href='index.html'" style="padding: 8px 15px;">Back to Dashboard</button>
        <h1 class="header-title">Order History & Reports</h1>
    </div>

    <hr class="separator" style="margin-top: 0;">

    <div class="filters-bar">
        <input type="text" id="filter-customer" class="input-field" placeholder="Filter by Customer..." style="width: 140px;">
        <input type="date" id="filter-start" class="input-field" style="width: 130px;">
        <input type="date" id="filter-end" class="input-field" style="width: 130px;">
        
        <span style="font-weight: bold;">Calculate:</span>
        <select id="group-box" class="dropdown" style="border-color: #CC5500;">
            <option value="None">None</option>
            <option value="Daily Revenue">Daily Revenue</option>
            <option value="Monthly Revenue">Monthly Revenue</option>
        </select>
        
        <button class="btn-green" onclick="applyFilters()">Apply Filters</button>
        <button class="btn-green" onclick="clearFilters()">Clear</button>
        <button class="btn-green" onclick="exportToCSV()">Export (CSV)</button>
    </div>

    <div class="table-pane">
        <table id="history-table">
            <thead>
                <tr>
                    <th style="width: 40px;">ID</th>
                    <th>Customer Name</th>
                    <th>Type</th>
                    <th>Payment</th>
                    <th>Order Date</th>
                    <th>Discount</th>
                    <th>Total</th>
                    <th>Profit</th>
                    <th style="width: 130px;">Grouped Revenue</th>
                    <th style="width: 150px; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody id="history-tbody"></tbody>
        </table>
    </div>

    <!-- VIEW ORDER MODAL -->
    <div id="view-modal" class="modal-overlay">
        <div class="modal-content" style="width: 500px;">
            <h2 id="view-title" class="modal-title">Order Details</h2>
            <div style="background: white; border: 1px solid #ccc; border-radius: 4px; height: 250px; overflow-y: auto;">
                <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                    <thead>
                        <tr style="background: #f7f3e8; border-bottom: 1px solid #ccc; text-align: left;">
                            <th style="padding: 8px;">Meal</th>
                            <th style="padding: 8px;">Side</th>
                            <th style="padding: 8px;">Qty</th>
                            <th style="padding: 8px;">Unit Price</th>
                            <th style="padding: 8px;">Total</th>
                        </tr>
                    </thead>
                    <tbody id="view-tbody"></tbody>
                </table>
            </div>
            <button class="btn-green" onclick="document.getElementById('view-modal').style.display='none'" style="padding: 10px;">Close</button>
        </div>
    </div>

    <!-- EDIT ORDER MODAL -->
    <div id="edit-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="edit-title" class="modal-title">Edit Order</h2>
            <span style="font-size: 14px;">Modify Items (Quantity changes update stock):</span>
            
            <div id="edit-list" style="background: white; border: 1px solid #ccc; border-radius: 4px; height: 180px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px;"></div>
            
            <div style="display: grid; grid-template-columns: 100px 1fr; gap: 10px; align-items: center; font-size: 14px;">
                <span>Date:</span> <input type="text" id="edit-date" class="input-field">
                <span>Discount %:</span> <input type="number" id="edit-discount" class="input-field" style="width: 80px;" oninput="updateLiveEditTotal()">
                <span>Order Type:</span>
                <div style="display: flex; gap: 10px;">
                    <select id="edit-type" class="dropdown" onchange="toggleProvider()">
                        <option value="Dine in">Dine in</option>
                        <option value="Pickup">Pickup</option>
                        <option value="Catering">Catering</option>
                        <option value="Delivery">Delivery</option>
                    </select>
                    <select id="edit-provider" class="dropdown" style="display: none;">
                        <option value="Uber">Uber</option>
                        <option value="Talabat">Talabat</option>
                        <option value="Self">Self</option>
                    </select>
                </div>
                <span>Payment:</span>
                <select id="edit-payment" class="dropdown" style="width: 150px;">
                    <option value="Cash">Cash</option>
                    <option value="Instapay">Instapay</option>
                    <option value="Telda">Telda</option>
                </select>
            </div>

            <p id="edit-live-total" style="font-weight: bold; color: #CC5500; font-size: 16px; margin: 5px 0;"></p>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn-red" style="flex: 1; padding: 10px;" onclick="document.getElementById('edit-modal').style.display='none'">Cancel</button>
                <button class="btn-green" style="flex: 2; padding: 10px;" onclick="saveOrderEdits()">Apply & Save Order</button>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://ominous-parakeet-77p9vw547xwp2xx5w-8081.app.github.dev/api';
        let allOrders = [];
        let revenueMap = {};
        
        let editingOrderId = null;
        let editableItems = [];

        async function loadTableData(customer = "", startDate = "", endDate = "") {
            try {
                let url = `${BASE_URL}/orders?customer=${encodeURIComponent(customer)}&startDate=${encodeURIComponent(startDate)}&endDate=${encodeURIComponent(endDate)}`;
                const res = await fetch(url);
                allOrders = await res.json();
                
                calculateRevenues();
                renderTable();
            } catch (error) {
                console.error("Failed to load orders:", error);
            }
        }

        function getGroupKey(dateStr) {
            if (!dateStr || dateStr.length < 10) return "Unknown";
            const grouping = document.getElementById('group-box').value;
            if (grouping === "Monthly Revenue") return dateStr.substring(0, 7);
            if (grouping === "Daily Revenue") return dateStr.substring(0, 10);
            return dateStr;
        }

        function calculateRevenues() {
            revenueMap = {};
            const grouping = document.getElementById('group-box').value;
            if (grouping === "None") return;

            allOrders.forEach(o => {
                const key = getGroupKey(o.orderDate);
                if (!revenueMap[key]) revenueMap[key] = 0;
                revenueMap[key] += o.totalCost;
            });
        }

        function renderTable() {
            const tbody = document.getElementById('history-tbody');
            tbody.innerHTML = '';
            const grouping = document.getElementById('group-box').value;
            
            let prevKey = "";

            allOrders.forEach((o, index) => {
                const tr = document.createElement('tr');
                
                let groupDisplay = "";
                let groupStyle = "";
                
                if (grouping !== "None") {
                    const currentKey = getGroupKey(o.orderDate);
                    // Checking if this is the first row for this specific group
                    let isFirstInGroup = true;
                    if (index > 0) {
                        const prevOrder = allOrders[index - 1];
                        if (getGroupKey(prevOrder.orderDate) === currentKey) {
                            isFirstInGroup = false;
                        }
                    }

                    if (isFirstInGroup) {
                        groupDisplay = `${revenueMap[currentKey].toFixed(2)} EGP`;
                        groupStyle = "class='group-header'";
                    }
                }

                tr.innerHTML = `
                    <td>${o.id}</td>
                    <td>${o.customerName}</td>
                    <td>${o.deliveryMethod}</td>
                    <td>${o.paymentMethod || 'Cash'}</td>
                    <td>${o.orderDate}</td>
                    <td style="text-align: center;">${o.discountPercentage}</td>
                    <td>${o.totalCost.toFixed(2)}</td>
                    <td>${o.totalProfit.toFixed(2)}</td>
                    <td ${groupStyle}>${groupDisplay}</td>
                    <td class="action-cell">
                        <button class="btn-orange" style="background-color: #f39c12;" onclick="showOrderDetails(${o.id}, '${o.customerName}')">View</button>
                        <button class="btn-blue" onclick="showEditOrder(${index})">Edit</button>
                        <button class="btn-red" onclick="deleteOrder(${o.id})">X</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('group-box').addEventListener('change', () => {
            calculateRevenues();
            renderTable();
        });

        function applyFilters() {
            const customer = document.getElementById('filter-customer').value.trim();
            const start = document.getElementById('filter-start').value;
            const end = document.getElementById('filter-end').value;

            if (start && end && end < start) {
                alert("The end date cannot be earlier than the start date.");
                return;
            }
            loadTableData(customer, start, end);
        }

        function clearFilters() {
            document.getElementById('filter-customer').value = '';
            document.getElementById('filter-start').value = '';
            document.getElementById('filter-end').value = '';
            document.getElementById('group-box').value = 'None';
            loadTableData();
        }

        async function deleteOrder(id) {
            if (confirm(`Delete Order ID: ${id}?\nThis will permanently remove the order and RESTORE the ingredients to the stock inventory. Continue?`)) {
                try {
                    const res = await fetch(`${BASE_URL}/orders/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        applyFilters(); // Reload using current filters
                    } else {
                        alert("Failed to delete the order from the database.");
                    }
                } catch (error) {
                    console.error("Delete error:", error);
                }
            }
        }

        // --- VIEW LOGIC ---
        async function showOrderDetails(orderId, customerName) {
            document.getElementById('view-title').innerText = `Items for Order #${orderId} (${customerName})`;
            const tbody = document.getElementById('view-tbody');
            tbody.innerHTML = '<tr><td colspan="5">Loading...</td></tr>';
            document.getElementById('view-modal').style.display = 'flex';

            try {
                const res = await fetch(`${BASE_URL}/orders/${orderId}/items`);
                const items = await res.json();
                tbody.innerHTML = '';
                items.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.meal.name}</td>
                        <td>${item.chosenSide || ''}</td>
                        <td>${item.quantity}</td>
                        <td>${item.meal.price.toFixed(2)}</td>
                        <td>${(item.meal.price * item.quantity).toFixed(2)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="5">Failed to load items.</td></tr>';
            }
        }

        // --- EDIT LOGIC ---
        function toggleProvider() {
            const type = document.getElementById('edit-type').value;
            document.getElementById('edit-provider').style.display = type === 'Delivery' ? 'inline-block' : 'none';
        }

        async function showEditOrder(index) {
            const order = allOrders[index];
            editingOrderId = order.id;
            
            document.getElementById('edit-title').innerText = `Edit Items & Details for Order #${order.id}`;
            document.getElementById('edit-date').value = order.orderDate;
            document.getElementById('edit-discount').value = order.discountPercentage.replace("%", "");
            
            document.getElementById('edit-payment').value = order.paymentMethod || 'Cash';

            const typeCombo = document.getElementById('edit-type');
            const providerCombo = document.getElementById('edit-provider');
            
            if (order.deliveryMethod && order.deliveryMethod.startsWith('Delivery')) {
                typeCombo.value = 'Delivery';
                providerCombo.style.display = 'inline-block';
                if (order.deliveryMethod.includes('Uber')) providerCombo.value = 'Uber';
                else if (order.deliveryMethod.includes('Talabat')) providerCombo.value = 'Talabat';
                else providerCombo.value = 'Self';
            } else {
                typeCombo.value = order.deliveryMethod || 'Dine in';
                providerCombo.style.display = 'none';
                providerCombo.value = 'Self';
            }

            document.getElementById('edit-list').innerHTML = 'Loading items...';
            document.getElementById('edit-modal').style.display = 'flex';

            try {
                const res = await fetch(`${BASE_URL}/orders/${order.id}/items`);
                editableItems = await res.json();
                renderEditItems();
                updateLiveEditTotal();
            } catch (error) {
                document.getElementById('edit-list').innerHTML = 'Failed to load items.';
            }
        }

        function renderEditItems() {
            const list = document.getElementById('edit-list');
            list.innerHTML = '';

            editableItems.forEach((item, idx) => {
                const itemTotal = item.meal.price * item.quantity;
                const sideDisplay = item.chosenSide ? ` [${item.chosenSide}]` : "";
                
                const row = document.createElement('div');
                row.style.display = 'flex';
                row.style.alignItems = 'center';
                row.style.justifyContent = 'space-between';
                row.style.borderBottom = '1px solid #eee';
                row.style.paddingBottom = '5px';

                row.innerHTML = `
                    <span style="flex-grow: 1; font-weight: bold;">${item.meal.name}${sideDisplay}</span>
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <button class="btn-orange" style="padding: 2px 8px;" onclick="changeEditQty(${idx}, -1)">-</button>
                        <span style="width: 20px; text-align: center;">${item.quantity}</span>
                        <button class="btn-green" style="padding: 2px 8px;" onclick="changeEditQty(${idx}, 1)">+</button>
                    </div>
                    <span style="width: 70px; text-align: right;">${itemTotal.toFixed(2)} EGP</span>
                `;
                list.appendChild(row);
            });
        }

        function changeEditQty(index, delta) {
            editableItems[index].quantity += delta;
            if (editableItems[index].quantity <= 0) {
                editableItems.splice(index, 1);
            }
            renderEditItems();
            updateLiveEditTotal();
        }

        function updateLiveEditTotal() {
            let sub = 0;
            let estProfit = 0;

            editableItems.forEach(item => {
                const total = item.meal.price * item.quantity;
                sub += total;
                estProfit += total * ((item.meal.profitPercentage || 0) / 100.0);
            });

            let pct = parseFloat(document.getElementById('edit-discount').value) || 0;
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;

            const discAmt = sub * (pct / 100.0);
            let fin = sub - discAmt;
            if (fin < 0) fin = 0;
            estProfit -= discAmt;

            document.getElementById('edit-live-total').innerText = `Final Total: ${fin.toFixed(2)} EGP (Profit: ${estProfit.toFixed(2)} EGP)`;
        }

        async function saveOrderEdits() {
            if (editableItems.length === 0) {
                alert("An order must contain at least one item. If you want to cancel the order, use the Delete (X) button instead.");
                return;
            }

            let sub = 0;
            let totalProfit = 0;
            const cartItemsPayload = [];

            editableItems.forEach(item => {
                const total = item.meal.price * item.quantity;
                sub += total;
                totalProfit += total * ((item.meal.profitPercentage || 0) / 100.0);

                cartItemsPayload.push({
                    mealId: item.meal.id,
                    quantity: item.quantity,
                    chosenSide: item.chosenSide || "",
                    customMeal: null
                });
            });

            let pct = parseFloat(document.getElementById('edit-discount').value) || 0;
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;

            const discAmt = sub * (pct / 100.0);
            let finalTotal = sub - discAmt;
            if (finalTotal < 0) finalTotal = 0;
            totalProfit -= discAmt;

            let finalMethod = document.getElementById('edit-type').value;
            if (finalMethod === 'Delivery') {
                finalMethod = `Delivery (${document.getElementById('edit-provider').value})`;
            }

            const payload = {
                cartItems: cartItemsPayload,
                finalTotal: finalTotal,
                discountAmount: discAmt,
                orderDate: document.getElementById('edit-date').value.trim(),
                totalProfit: totalProfit,
                deliveryMethod: finalMethod,
                paymentMethod: document.getElementById('edit-payment').value
            };

            try {
                const res = await fetch(`${BASE_URL}/orders/${editingOrderId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    document.getElementById('edit-modal').style.display = 'none';
                    applyFilters(); // Reload table
                    alert("Order successfully updated and stock inventory adjusted.");
                } else {
                    alert("Failed to modify the order.");
                }
            } catch (error) {
                console.error("Save edit error:", error);
            }
        }

        function exportToCSV() {
            if (allOrders.length === 0) {
                alert("There is no data to export.");
                return;
            }

            const grouping = document.getElementById('group-box').value;
            const csvRows = [];
            
            csvRows.push("Order ID,Customer Name,Username,Phone,Order Type,Payment Method,Order Date,Discount (%),Order Total (EGP),Total Profit (EGP),Grouped Revenue (EGP),Grouping Method");
            
            let prevKey = "";
            
            allOrders.forEach(o => {
                const currentKey = getGroupKey(o.orderDate);
                let groupedRevenueStr = "";
                
                if (grouping !== "None" && currentKey !== prevKey) {
                    groupedRevenueStr = revenueMap[currentKey].toFixed(2);
                    prevKey = currentKey;
                }

                const username = o.customerUsername || "";
                const phone = o.customerPhone || "";
                const payment = o.paymentMethod || "Cash";
                const groupMethodName = grouping === "None" ? "" : grouping;

                const row = `"${o.id}","${o.customerName}","${username}","${phone}","${o.deliveryMethod}","${payment}","${o.orderDate}","${o.discountPercentage}","${o.totalCost.toFixed(2)}","${o.totalProfit.toFixed(2)}","${groupedRevenueStr}","${groupMethodName}"`;
                csvRows.push(row);
            });

            const csvString = csvRows.join("\n");
            const blob = new Blob([csvString], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `Order_Report_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        window.onload = () => loadTableData();
    </script>
</body>
</html>
